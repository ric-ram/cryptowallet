spring.config.import=optional:file:env.properties

spring.application.name=cryptowallet

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://${DB_DATABASE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PW}

coincap.api.base-url=https://rest.coincap.io
coincap.api.key=${COINCAP_API_KEY}

# Pulling every 5 minutes
app.prices.poll-rate-ms=300000

springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
